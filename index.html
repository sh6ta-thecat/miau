<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .entrada { display: flex; gap: 8px; margin-bottom: 20px; }
  .entrada__texto { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  .entrada__boton { padding: 10px 18px; font-size: 16px; cursor: pointer; border: 0; border-radius: 6px; background: #2563eb; color: #fff; }
  .entrada__boton:disabled { background: #94a3b8; cursor: wait; }
  .panel__derecho { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; text-align: center; min-height: 220px; }
  .panel__derecho img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .error { color: #b91c1c; }
</style>
</head>
<body>

<div class="entrada">
  <input id="input-registro" class="entrada__texto" type="text" placeholder="Ingresa el número" autofocus>
  <button id="btn-consultar" class="entrada__boton" type="button">Ingresar</button>
</div>

<section class="panel__derecho">
  <div class="panel__derecho-fotografia">
    <img id="foto" alt="fotografia" src="assets/imagenes/no-photo.png">
  </div>
  <div class="panel__derecho-informacion">
    <p id="estado">SIN SITUACIÓN</p>
  </div>
</section>

<script>
const input   = document.getElementById('input-registro');
const boton   = document.getElementById('btn-consultar');
const foto    = document.getElementById('foto');
const estado  = document.getElementById('estado');

async function consultar() {
  const numero = input.value.trim();
  if (!numero) return;

  boton.disabled = true;
  boton.textContent = 'Consultando...';
  estado.textContent = 'Cargando...';
  estado.classList.remove('error');

  const PLACEHOLDER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='%23eee'/><text x='50%' y='50%' font-family='sans-serif' font-size='14' fill='%23999' text-anchor='middle' dy='.3em'>Sin foto</text></svg>";

  try {
    const res = await fetch('proxy.php?numero=' + encodeURIComponent(numero));
    const texto = await res.text();

    if (!texto) throw new Error('Respuesta vacía del proxy (HTTP ' + res.status + ')');

    let data;
    try { data = JSON.parse(texto); }
    catch (e) { throw new Error('No es JSON: ' + texto.slice(0, 300)); }

    if (data.error) throw new Error(data.error);

    foto.src = data.imagen || PLACEHOLDER;

    // Muestra nombre + situación si quieres
    estado.innerHTML = '<strong>' + (data.nombre || '') + '</strong><br>' +
                       (data.situacion || 'SIN SITUACIÓN');

  } catch (e) {
    estado.textContent = 'Error: ' + e.message;
    estado.classList.add('error');
    foto.src = PLACEHOLDER;
    console.error(e);
  } finally {
    boton.disabled = false;
    boton.textContent = 'Ingresar';
  }
}


boton.addEventListener('click', consultar);
input.addEventListener('keydown', e => { if (e.key === 'Enter') consultar(); });
</script>

</body>
</html>
